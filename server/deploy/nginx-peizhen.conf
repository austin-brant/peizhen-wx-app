# 陪诊预约后端 Nginx 反向代理配置
# 用法：sudo cp nginx-peizhen.conf /etc/nginx/sites-available/peizhen
#       sudo ln -s /etc/nginx/sites-available/peizhen /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# 域名备案下来后：把下方 server_name 换成你的域名，
# 并用 certbot 一键上 HTTPS：sudo certbot --nginx -d 你的域名
server {
    listen 80;
    server_name 120.53.4.14;   # 备案后换成域名

    client_max_body_size 2m;

    # API 反代到本机 8300（后端仅监听 127.0.0.1）
    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
